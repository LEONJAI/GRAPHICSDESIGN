<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in – Pixel &amp; Pine</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
 <header><a class="logo" href="index.html">Pixel &amp; Pine</a><nav><a href="index.html">Home</a></nav></header>

 <main class="auth" id="guest">
  <h1 id="title">Log in</h1>

  <div id="signupFields" hidden>
   <div class="row">
    <div><label for="firstName">First name</label><input id="firstName" type="text" autocomplete="given-name"></div>
    <div><label for="lastName">Last name</label><input id="lastName" type="text" autocomplete="family-name"></div>
   </div>
   <label for="username">Username</label>
   <input id="username" type="text" autocomplete="username" placeholder="letters, numbers, underscore">
   <label for="birthday">Birthday</label>
   <input id="birthday" type="date" autocomplete="bday">
   <label for="address">Address</label>
   <input id="address" type="text" autocomplete="street-address">
  </div>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" minlength="8">
  <button class="link" id="forgot" type="button">Forgot password?</button>
  <button class="btn" id="submit">Log in</button>
  <button class="link" id="toggle">Need an account? Sign up</button>
  <div class="msg" id="msg" role="status"></div>
 </main>
</div>
<script src="config.js"></script>
<script src="showpass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="login.js"></script>
</body>
</html>
